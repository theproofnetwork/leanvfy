name: Test Helper Scripts

# Three jobs, all on every push and pull request; nothing here produces
# attestations (e2e.yml does, with the real reusable workflow).
#   lint      runs the same pre-commit hooks a `git commit` runs locally
#             (.pre-commit-config.yaml): formatting, shellcheck, workflow
#             linting and security audit (every `uses:` SHA-pinned), lockfile
#             and requirements pinning, secrets.
#   scripts   exercises the trusted host-side scripts against the inputs a
#             hostile prover controls, without Lean: URL shapes, adversarial
#             repository trees, Lake manifests and the tree digest
#             (scripts/test-fetch.sh); toolchain.lock, provisioning with
#             sha256 enforcement and the predicate (scripts/test-toolchain.sh);
#             verify.sh's claim checks against a shim gh
#             (scripts/test-verify.sh); and that the comparator patch still
#             applies to the pinned upstream commit.
#   pipeline  provisions the real pinned toolchain and runs the evaluate
#             pipeline end to end on local Lake packages: honest and dishonest
#             solutions through the build jails, comparator and all three
#             kernels, plus jail containment (scripts/test-pipeline.sh).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      # shellcheck on PATH lets actionlint also check the `run:` blocks of the
      # workflows; the scripts themselves are covered by the shellcheck hook.
      # pre-commit is version-pinned; the hooks it runs are pinned by commit id
      # in .pre-commit-config.yaml.
      - name: Install pre-commit
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
          pipx install pre-commit==4.6.0

      - name: Run all hooks
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install System Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
                       bubblewrap jq curl git openssl python3 ca-certificates zstd
          # Same as leanvfy.yml: grant `userns` to bwrap alone via AppArmor.
          bash scripts/allow-bwrap-userns.sh

      # The AppArmor exception must be scoped to bwrap. Ubuntu's restriction
      # does not refuse user namespaces to unconfined processes; it moves any
      # unconfined process that creates one into the `unprivileged_userns`
      # profile, which denies every capability inside the namespace. So the
      # check is: an unprofiled process (python3 -- not /usr/bin/unshare, which
      # has its own userns-granting profile) ends up under that label and
      # cannot use a capability, while the jails (tested below) work.
      - name: User namespace restriction still applies to everything but bwrap
        run: |
          set -euo pipefail
          [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1 ]
          [ "$(cat /proc/self/attr/apparmor/current)" = unconfined ]
          python3 - <<'EOF'
          import os, socket, sys
          os.unshare(os.CLONE_NEWUSER | os.CLONE_NEWUTS)
          label = open('/proc/self/attr/apparmor/current').read().strip()
          if not label.startswith('unprivileged_userns'):
              sys.exit(f"unconfined process created a user namespace and kept label {label!r}; restriction is off")
          try:
              socket.sethostname('leanvfy-probe')   # CAP_SYS_ADMIN in the new namespace
          except PermissionError:
              print(f"user namespace confined by {label}: capabilities denied, as intended")
          else:
              sys.exit("capabilities usable inside an unprivileged user namespace; restriction is off")
          EOF

      # check-jsonschema for build-predicate.sh, installed exactly as the
      # attest job installs it (hash-pinned, no dependency resolution).
      - name: Install check-jsonschema
        run: |
          set -euo pipefail
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --require-hashes --no-deps --only-binary=:all: -r scripts/requirements.txt
          echo "/tmp/venv/bin" >> "$GITHUB_PATH"

      - name: Untrusted-input hardening (fetch, manifests, tree digest)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/test-fetch.sh

      - name: Lockfile, provisioning and predicate
        run: bash scripts/test-toolchain.sh

      - name: Verifier (verify.sh against a shim gh)
        run: bash scripts/test-verify.sh

      # The comparator patch must keep applying to the pinned upstream commit.
      - name: Comparator patch applies to the pinned commit
        run: |
          set -euo pipefail
          commit="$(jq -er '.tools[] | select(.name == "comparator") | .commit' toolchain.lock)"
          git clone -q --no-checkout https://github.com/leanprover/comparator.git /tmp/comparator
          git -C /tmp/comparator checkout -q "$commit"
          for p in $(jq -r '.tools[] | select(.name == "comparator") | .patches[]' toolchain.lock); do
            git -C /tmp/comparator apply --check "$GITHUB_WORKSPACE/$p"
            echo "$p applies"
          done

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      # The same packages and the same AppArmor exception as leanvfy.yml's
      # evaluate job (openssl and python3 serve the fixtures over https).
      - name: Install System Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
                       bubblewrap jq curl coreutils zstd git openssl python3 ca-certificates
          bash scripts/allow-bwrap-userns.sh

      # The real thing: the Lean release and the verifier binaries of
      # toolchain.lock, hash-checked, into /opt/lean and /opt/bin.
      - name: Provision Pinned Toolchain
        run: bash scripts/provision-toolchain.sh toolchain.lock

      - name: Assert No Lean On Host
        run: |
          set -euo pipefail
          if command -v lean || command -v lake; then
            echo "Security violation: Lean toolchain reachable on the host." >&2
            exit 1
          fi

      - name: Evaluate pipeline end to end (build jails, comparator, kernels)
        run: bash scripts/test-pipeline.sh
