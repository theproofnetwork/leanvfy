name: Verify Adversarial Lean Proof

on:
  workflow_call:
    inputs:
      theorem:
        description: "Fully-qualified name of the theorem to verify, as declared in the challenge module"
        required: true
        type: string
      challenge_repo:
        description: "HTTPS URL of the git repository holding the (trusted by the verifier) challenge Lake package"
        required: true
        type: string
      challenge_commit:
        description: "Full commit id of the challenge to check out"
        required: true
        type: string
      challenge_module:
        description: "Module of the challenge package that declares the theorem"
        required: false
        default: Challenge
        type: string
      solution_repo:
        description: "HTTPS URL of the git repository holding the untrusted solution Lake package"
        required: true
        type: string
      solution_commit:
        description: "Full commit id of the solution to check out"
        required: true
        type: string
      solution_module:
        description: "Module of the solution package that proves the theorem"
        required: false
        default: Solution
        type: string

permissions: {}

env:
  # Axiom whitelist. comparator rejects the solution if the theorem depends on
  # any other axiom (or sorry) and passes the same list to nanoda, which treats
  # an unlisted axiom anywhere in the export as a hard error. eink0rn takes no
  # axiom list; it only judges well-typedness. Defined once so the value the
  # checks ran with is the value recorded in the predicate.
  ALLOWED_AXIOMS: propext,Quot.sound,Classical.choice
  # in-toto predicate type of the attestation; schema in schemas/leanvfy-v1.json
  PREDICATE_TYPE: https://github.com/theproofnetwork/leanvfy/predicate/v1

jobs:
  # =========================================================================
  # JOB 1: SANDBOXED BUILDS, EXPORTS, COMPARISON AND THREE KERNELS
  # =========================================================================
  evaluate:
    runs-on: ubuntu-latest
    # NOTE: Self-hosted runners cannot be rejected here; the `runner` context is
    # not available in job-level `if`, and a step-level check would run on the
    # attacker's machine. Verifiers must reject attestations whose certificate
    # says runner_environment != github-hosted.
    permissions:
      contents: read
    env:
      # The two Lake workspaces checked out from the untrusted inputs, each
      # built and exported in its own jail. Nothing on the host ever executes
      # anything from them: the host runs git and jq on them (inside their own
      # jail) and hashes them.
      CHALLENGE_DIR: /tmp/challenge
      SOLUTION_DIR: /tmp/solution
      # lean4export outputs, the only thing that leaves the build jails.
      EXPORT_DIR: /tmp/exports
    outputs:
      challenge_digest: ${{ steps.digest.outputs.challenge_digest }}
      solution_digest: ${{ steps.digest.outputs.solution_digest }}
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      # Check out *this* reusable workflow's repository at the exact commit that
      # is executing. `job.workflow_repository` / `job.workflow_sha` refer to the
      # called workflow, not the caller, and the same commit is bound into the
      # attestation certificate as job_workflow_sha. Helper scripts under
      # leanvfy/scripts are therefore fixed by the attested identity.
      - name: Check out trusted helper scripts
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: leanvfy
          persist-credentials: false

      # Inputs are only ever passed through `env:`, never spliced into a
      # script, and rejected here unless they have exactly the shape the rest
      # of the pipeline assumes. The scripts re-check their own arguments.
      - name: Validate Inputs
        env:
          THEOREM: ${{ inputs.theorem }}
          CHALLENGE_REPO: ${{ inputs.challenge_repo }}
          CHALLENGE_COMMIT: ${{ inputs.challenge_commit }}
          CHALLENGE_MODULE: ${{ inputs.challenge_module }}
          SOLUTION_REPO: ${{ inputs.solution_repo }}
          SOLUTION_COMMIT: ${{ inputs.solution_commit }}
          SOLUTION_MODULE: ${{ inputs.solution_module }}
        run: |
          set -euo pipefail
          fail() { echo "Error: $1" >&2; exit 1; }
          [[ "$THEOREM" =~ ^[^[:space:][:cntrl:]]+$ ]] || fail "theorem must be a single Lean declaration name"
          for v in CHALLENGE_REPO SOLUTION_REPO; do
            [[ "${!v}" =~ ^https://[^[:space:][:cntrl:]@]+$ ]] || fail "$v must be an https:// URL without userinfo"
          done
          for v in CHALLENGE_COMMIT SOLUTION_COMMIT; do
            [[ "${!v}" =~ ^([a-f0-9]{40}|[a-f0-9]{64})$ ]] || fail "$v must be a full lowercase commit id"
          done
          for v in CHALLENGE_MODULE SOLUTION_MODULE; do
            [[ "${!v}" =~ ^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*$ ]] || fail "$v must be a dotted Lean module name"
          done
          echo "Inputs accepted"

      # git is needed for the checkouts below and inside the build jails (Lake
      # checks each dependency's revision with it); the runner image ships it,
      # but do not depend on that.
      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
                       bubblewrap jq curl coreutils zstd git
          # Ubuntu 24.04 confines unprivileged user namespaces with AppArmor,
          # and under the profile it ships for bwrap the nested namespace that
          # --disable-userns relies on cannot be set up. Grant `userns` to
          # /usr/bin/bwrap alone; the machine-wide restriction stays on.
          bash leanvfy/scripts/allow-bwrap-userns.sh

      # Fetches the Lean release from leanprover/lean4 and the prebuilt verifier
      # binaries from this repo's releases, each checked against the sha256 in
      # toolchain.lock. The lockfile is part of the trusted checkout, so the
      # attested job.workflow_sha pins the exact toolchain. Never cache this:
      # actions/cache is scoped to the caller (prover) repository.
      - name: Provision Pinned Toolchain
        run: bash leanvfy/scripts/provision-toolchain.sh leanvfy/toolchain.lock

      # The URLs are prover-controlled locators and nothing about them is
      # trusted; the commit ids are content addresses, and the attestation binds
      # a sha256 over the checked-out tree computed here by trusted code.
      # fetch-repo.sh runs git inside its own network-enabled jail and accepts
      # only https, only the requested commit, and only trees without Lake build
      # outputs (a committed .olean would let the exported environment differ
      # from what a reviewer of the sources sees). The challenge must be
      # configured by lakefile.toml, which cannot run code, so that nothing but
      # its sources and its pinned dependencies determine what is exported.
      - name: Fetch Untrusted Repositories & Compute Tree Digests
        id: digest
        env:
          CHALLENGE_REPO: ${{ inputs.challenge_repo }}
          CHALLENGE_COMMIT: ${{ inputs.challenge_commit }}
          SOLUTION_REPO: ${{ inputs.solution_repo }}
          SOLUTION_COMMIT: ${{ inputs.solution_commit }}
        run: |
          set -euo pipefail
          bash leanvfy/scripts/fetch-repo.sh --require-toml "$CHALLENGE_REPO" "$CHALLENGE_COMMIT" "$CHALLENGE_DIR"
          bash leanvfy/scripts/fetch-repo.sh "$SOLUTION_REPO" "$SOLUTION_COMMIT" "$SOLUTION_DIR"

          echo "challenge_digest=$(bash leanvfy/scripts/tree-digest.sh "$CHALLENGE_DIR" "$CHALLENGE_COMMIT")" >> "$GITHUB_OUTPUT"
          echo "solution_digest=$(bash leanvfy/scripts/tree-digest.sh "$SOLUTION_DIR" "$SOLUTION_COMMIT")" >> "$GITHUB_OUTPUT"

      # The jail has no network, so every dependency either workspace needs is
      # checked out here, at the exact revision its lake-manifest.json pins,
      # through the same fetch-repo.sh jail and tree policy. Lake itself never
      # runs on the host: `lake update` would elaborate dependency lakefiles.
      # The challenge's dependencies are thereby fixed by the attested challenge
      # commit; the solution's are as untrusted as the solution and judged the
      # same way (exported closure, three kernels).
      - name: Materialize Pinned Dependencies
        run: |
          set -euo pipefail
          bash leanvfy/scripts/materialize-deps.sh "$CHALLENGE_DIR"
          bash leanvfy/scripts/materialize-deps.sh "$SOLUTION_DIR"

      # The host never has Lean in PATH: building, exporting and verifying
      # happen inside bubblewrap jails only, and this assert enforces that.
      - name: Assert No Lean On Host
        run: |
          set -euo pipefail
          if command -v lean || command -v lake; then
            echo "Security violation: Lean toolchain reachable on the host." >&2
            exit 1
          fi

      # comparator's configuration (the theorem, the axiom whitelist, the
      # external kernels) and, from comparator itself, the declarations the
      # exports below must contain; see scripts/write-comparator-config.sh.
      - name: Write Comparator Config & Export Targets
        env:
          THEOREM: ${{ inputs.theorem }}
          CHALLENGE_MODULE: ${{ inputs.challenge_module }}
          SOLUTION_MODULE: ${{ inputs.solution_module }}
        run: bash leanvfy/scripts/write-comparator-config.sh /tmp/comparator.json /tmp/export-targets

      # -----------------------------------------------------------------------
      # SANDBOXED BUILDS AND EXPORTS -- the only places prover code runs
      # -----------------------------------------------------------------------
      # Each workspace is built (`lake build`) and exported (`lean4export`) in
      # its own throwaway jail holding nothing but that workspace, the challenge
      # first. A build jail sees neither the other workspace nor the other
      # export; only the export text leaves it, through a pipe the jailed
      # processes cannot reach, and every process the build started is gone
      # when the jail exits.
      - name: Build & Export Challenge (sandboxed)
        env:
          CHALLENGE_MODULE: ${{ inputs.challenge_module }}
        run: |
          set -euo pipefail
          bash leanvfy/scripts/sandboxed-build-export.sh "$CHALLENGE_DIR" "$CHALLENGE_MODULE" \
            /tmp/export-targets "$EXPORT_DIR/challenge.export"

      - name: Build & Export Solution (sandboxed)
        env:
          SOLUTION_MODULE: ${{ inputs.solution_module }}
        run: |
          set -euo pipefail
          bash leanvfy/scripts/sandboxed-build-export.sh "$SOLUTION_DIR" "$SOLUTION_MODULE" \
            /tmp/export-targets "$EXPORT_DIR/solution.export"

      # -----------------------------------------------------------------------
      # SANDBOXED COMPARISON AND KERNELS -- prover bytes, no prover code
      # -----------------------------------------------------------------------
      # A third jail holds only the verifier binaries and the two exports.
      # comparator checks that the solution states the theorem exactly as the
      # challenge does (the whole closure of the statement, constant by
      # constant; an export missing any of it is rejected) and uses only
      # whitelisted axioms, then hands the one solution export to every kernel
      # in `external_kernels` (each under landrun) and replays it through the
      # Lean kernel in-process. All kernels judge the same bytes and
      # comparator's exit status is the joint verdict.
      - name: Comparator, Lean Kernel, nanoda & eink0rn (sandboxed)
        run: |
          set -euo pipefail
          bash leanvfy/scripts/sandboxed-comparator.sh \
            "$EXPORT_DIR/challenge.export" "$EXPORT_DIR/solution.export" /tmp/comparator.json

      # Reached only if every step above exited 0.
      - name: Record Verdict
        id: verdict
        run: echo "verdict=SUCCESS" >> "$GITHUB_OUTPUT"

  # =========================================================================
  # JOB 2: ATTESTATION (Privileged; isolated from all execution environments)
  # =========================================================================
  attest:
    needs: evaluate
    if: needs.evaluate.outputs.verdict == 'SUCCESS'
    runs-on: ubuntu-latest
    # NOTE: see runner-environment note on the `evaluate` job.
    permissions:
      id-token: write
      contents: read
      attestations: write
      # this writes the attestation statement to some overview page on gh
      artifact-metadata: write # optional
    steps:
      - name: Check out trusted helper scripts & schema
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: leanvfy
          persist-credentials: false

      # jq assembles the predicate, check-jsonschema validates it. Declared here
      # rather than relying on the runner image happening to ship jq.
      # check-jsonschema is hash-pinned via scripts/requirements.txt: nothing is
      # resolved at run time and pip refuses any package whose bytes differ.
      - name: Install Validation Tools
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends jq
          python3 -m venv /tmp/attest-venv
          /tmp/attest-venv/bin/pip install --require-hashes --no-deps --only-binary=:all: \
            -r leanvfy/scripts/requirements.txt
          echo "/tmp/attest-venv/bin" >> "$GITHUB_PATH"

      # The predicate carries only the verification claim and the toolchain
      # facts. Workflow identity, runner environment, repository and run id are
      # NOT passed in: the certificate minted below states them from GitHub's
      # OIDC token, and verifiers must read them from there (README
      # "Attestation contents").
      - name: Build Verification Predicate
        env:
          THEOREM: ${{ inputs.theorem }}
          CHALLENGE_REPO: ${{ inputs.challenge_repo }}
          CHALLENGE_COMMIT: ${{ inputs.challenge_commit }}
          CHALLENGE_MODULE: ${{ inputs.challenge_module }}
          CHALLENGE_DIGEST: ${{ needs.evaluate.outputs.challenge_digest }}
          SOLUTION_REPO: ${{ inputs.solution_repo }}
          SOLUTION_COMMIT: ${{ inputs.solution_commit }}
          SOLUTION_MODULE: ${{ inputs.solution_module }}
          SOLUTION_DIGEST: ${{ needs.evaluate.outputs.solution_digest }}
          # Same trusted checkout as the evaluate job; expanded into the toolchain block
          TOOLCHAIN_LOCK: leanvfy/toolchain.lock
          SCHEMA_FILE: leanvfy/schemas/leanvfy-v1.json
        run: bash leanvfy/scripts/build-predicate.sh /tmp/attest/predicate.json

      # Subjects are the tree digests (scripts/tree-digest.sh) of the two
      # checkouts, named after the commits they were computed from, so that
      # `gh attestation verify` can find the attestation from either digest.
      - name: Prepare Subjects
        env:
          CHALLENGE_COMMIT: ${{ inputs.challenge_commit }}
          CHALLENGE_DIGEST: ${{ needs.evaluate.outputs.challenge_digest }}
          SOLUTION_COMMIT: ${{ inputs.solution_commit }}
          SOLUTION_DIGEST: ${{ needs.evaluate.outputs.solution_digest }}
        run: |
          cat <<EOF > /tmp/attest/subjects.checksums
          $CHALLENGE_DIGEST  challenge@$CHALLENGE_COMMIT
          $SOLUTION_DIGEST  solution@$SOLUTION_COMMIT
          EOF

      - name: Sign & Mint Attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: /tmp/attest/subjects.checksums
          predicate-type: ${{ env.PREDICATE_TYPE }}
          predicate-path: /tmp/attest/predicate.json
